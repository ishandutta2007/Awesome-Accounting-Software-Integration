<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <!-- Glowing Orbs Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <style>
      .glow-blob-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .glow-blob-2 {
        animation: floatOrb2 16s ease-in-out infinite alternate;
      }
      .data-packet {
        animation: packetMove 6s linear infinite;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .rotate-ring {
        transform-origin: 1060px 210px;
        animation: rotateRing 25s linear infinite;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes packetMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulsePill {
        0% { opacity: 0.7; transform: translateY(0px); }
        100% { opacity: 1; transform: translateY(-4px); }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Background Glowing Orbs (Strictly in Background) -->
  <g filter="url(#softGlow)" opacity="0.45">
    <circle class="glow-blob-1" cx="200" cy="120" r="140" fill="#38bdf8" />
    <circle class="glow-blob-2" cx="950" cy="300" r="160" fill="#6366f1" />
    <circle cx="600" cy="80" r="100" fill="#10b981" opacity="0.3" />
  </g>

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Dynamic Animated Tech Pipelines & Data Streams (Background Depth Layer) -->
  <g opacity="0.6">
    <!-- Curved flow line 1 -->
    <path d="M -50 320 C 300 240, 500 380, 850 280 C 1050 220, 1150 140, 1250 160" 
          fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="3" />
    <path class="data-packet" d="M -50 320 C 300 240, 500 380, 850 280 C 1050 220, 1150 140, 1250 160" 
          fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="25 150" />

    <!-- Curved flow line 2 -->
    <path d="M -50 100 C 250 180, 600 60, 900 160 C 1050 210, 1180 200, 1250 240" 
          fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="2" />
    <path class="data-packet" d="M -50 100 C 250 180, 600 60, 900 160 C 1050 210, 1180 200, 1250 240" 
          fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="15 120" style="animation-duration: 4.5s;" />
  </g>

  <!-- Decorative Orbit Elements on Far Right (Dynamic Architecture Motif) -->
  <g class="rotate-ring" opacity="0.35">
    <circle cx="1060" cy="210" r="130" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" stroke-dasharray="8 12" />
    <circle cx="1060" cy="210" r="90" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <circle cx="1190" cy="210" r="6" fill="#38bdf8" />
    <circle cx="970" cy="210" r="5" fill="#34d399" />
    <circle cx="1060" cy="120" r="4" fill="#818cf8" />
  </g>

  <!-- Floating Dynamic Feature Pills (Shifted & Translucent to keep text fully readable) -->
  <g class="pulse-pill" opacity="0.9">
    <!-- Pill 1: E-Commerce Sync -->
    <g transform="translate(860, 65)">
      <rect width="180" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">E-Commerce Sync</text>
    </g>

    <!-- Pill 2: General Ledger -->
    <g transform="translate(920, 120)">
      <rect width="170" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#34d399" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">General Ledger</text>
    </g>

    <!-- Pill 3: ERP & CRM iPaaS -->
    <g transform="translate(880, 320)">
      <rect width="185" height="34" rx="17" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#818cf8" />
      <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">ERP &amp; CRM Bridges</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle & Metadata (Always in Crisp Foreground) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 75)">
      <rect width="210" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">FINANCIAL ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="50" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Accounting Software
    </text>
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="50" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      Integration &amp; Automation
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1">
      Curated directory of enterprise iPaaS, e-commerce reconciliation, &amp; open-source ledgers.
    </text>

    <!-- Meta Tech Pills / Highlights -->
    <g transform="translate(0, 315)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="150" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">⚡ QuickBooks / Xero</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(162, 0)">
        <rect width="150" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🔄 ERPNext / NetSuite</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(324, 0)">
        <rect width="155" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">🛠️ Open-Source SDKs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(491, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">✨ Automated Sync</text>
      </g>
    </g>
  </g>
</svg>
